    '',
    '',
    '',
    ''
]

[physics]
gravity = [ 0.0, -9.81, 0.0 ]
hz = 60
substeps = 4

[render]
pipeline = 'forward'
bloom = true
bloomIntensity = 0.8
chromaticAberration = 0.005
chromaticAberrationEnabled = false
colorGrading = true
contrast = 0.0
exposure = 1.0
filmGrain = false
filmGrainIntensity = 0.03
filmGrainResponse = 0.8
fog = true
fogColor = [ 0.01, 0.01, 0.04 ]
fogDensity = 0.06
fogFar = 10.0
fxaa = true
hueShift = 0.0
lensDistortion = 0.0
lensDistortionEnabled = false
saturation = 1.0
shadow = true
showColliders = false
showDecalBounds = false
showSelectionOutline = true
passViewerEnabled = false
temperature = 0.0
tint = 0.0
vignette = false
vignetteColor = [ 0.0, 0.0, 0.0 ]
vignetteIntensity = 0.25
vignetteRoundness = 1.0
vignetteSmoothness = 0.45
wireframe = false

[[render.customPostProcesses]]
blend = 1.0
enabled = false
intensity = 1.0
name = 'Default Custom'
parameters = [ 0.0, 0.0, 0.0, 0.0 ]
shader = 'assets/shaders/PostProcess/Custom/CustomPostProcess.hlsl'

[screen]
height = 1080
width = 1920

[tags]
list = [ 'Untagged', 'Respawn', 'Finish', 'EditorOnly', 'MainCamera', 'Player', 'GameController' ]
