[app]
targetFps = 144

[project]
name = "{{PROJECT_NAME}}"
default_scene = "Assets/Scenes/Main.fbzz"

[runtime]
start_scene = "Assets/Scenes/Main.fbzz"

[audio]
bgmVolume = 1.0
seVolume = 1.0

[layers]
names = [
    'Default',
    'TransparentFX',
    'Ignore Raycast',
    '',
    'Water',
    'UI',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
