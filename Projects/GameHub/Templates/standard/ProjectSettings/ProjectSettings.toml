[app]
renderer = "dx12"
targetFps = 144

[audio]
masterVolume = 1.0

# AudioSource の Bus Name と、スクリプトの audio.SetBusVolume() が指す先。
[[audio.bus]]
name = 'Master'
volume = 1.0

[[audio.bus]]
name = 'BGM'
parent = 'Master'
volume = 1.0

[[audio.bus]]
name = 'SE'
parent = 'Master'
volume = 1.0

[[audio.bus]]
name = 'UI'
parent = 'Master'
volume = 1.0

[[audio.bus]]
name = 'Voice'
parent = 'Master'
volume = 1.0

[layers]
names = [
    'Default',
    'TransparentFX',
    'Ignore Raycast',
    '',
    'Water',
    'UI',
    '',
    '',
    '',
    'Static',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
    ''
]

[physics]
gravity = [ 0.0, -9.81, 0.0 ]
hz = 60
substeps = 1

[project]
default_scene = 'Assets/Scenes/Main.scene'
name = '{{PROJECT_NAME}}'

# プロジェクト全体で固定の描画構成のみを置く。
# ポストプロセス / 高度グラフィクス (Bloom, Fog, SSR, TAA, LUT …) は
# Assets/PostProcess/DefaultPostProcess.fzdata が既定値を持つ。
# 効かせるにはシーンへ "Post Process Volume" を置き、そこから参照すること。
[render]
pipeline             = 'deferred'

shadow               = true
shadowResolution     = 2048
shadowAutoFitDistance = 120.0
shadowCascadeCount   = 4
shadowCascadeSplitLambda = 0.75
shadowCascadeBlend   = 0.1
shadowPcfRadius      = 3
pcssEnabled          = false
pcssLightRadius      = 3.0

showColliders        = false
showDecalBounds      = false
showSelectionOutline = false
passViewerEnabled    = false

particleBudget        = 20000
particleBudgetEnabled = true

outlineColor         = [ 1.0, 0.82, 0.22, 1.0 ]
outlineWidth         = 0.045

[runtime]
start_scene = 'Assets/Scenes/Main.scene'

[screen]
height = 1080
width = 1920

[tags]
list = [ 'Untagged', 'Respawn', 'Finish', 'EditorOnly', 'MainCamera', 'Player', 'GameController' ]

[window]
fullscreen = false
height = 1080
title = 'FBZZ Game'
width = 1920
