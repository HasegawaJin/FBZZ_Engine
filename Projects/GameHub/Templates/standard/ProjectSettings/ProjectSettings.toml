[physics]
gravity = [ 0.0, -9.81, 0.0 ]
hz = 60
substeps = 1

[project]
default_scene = 'Assets/Scenes/Main.scene'
name = '{{PROJECT_NAME}}'

[render]
ambientOcclusion = true
ambientOcclusionIntensity = 1.0
bloom = true
bloomIntensity = 0.8
bloomSoftKnee = 0.35
bloomThreshold = 0.7
chromaticAberration = 0.005
chromaticAberrationEnabled = false
clarity = true
clarityRadius = 2.0
clarityStrength = 0.12
colorFilter = false
colorFilterColor = [ 1.0, 1.0, 1.0 ]
colorFilterIntensity = 0.0
colorGrading = true
contrast = 0.0
depthOfField = false
dofBlurRadius = 3.0
dofFocusDistance = 8.0
dofFocusRange = 4.0
exposure = 1.0
filmGrain = false
filmGrainIntensity = 0.03
filmGrainResponse = 0.8
fog = false
fogColor = [ 0.01, 0.01, 0.04 ]
fogDensity = 0.06
fogFar = 10.0
fxaa = true
hueShift = 0.0
lensDistortion = 0.0
lensDistortionEnabled = false
invert = false
invertIntensity = 1.0
outlineColor = [ 1.0, 0.82, 0.22, 1.0 ]
outlineWidth = 0.045
passViewerEnabled = false
pixelate = false
pixelSize = 4.0
pipeline = 'forward'
posterize = false
posterizeLevels = 6.0
saturation = 1.0
sepia = false
sepiaIntensity = 0.75
shadow = true
shadowHighlight = true
shadowLift = 0.08
sharpen = false
sharpenRadius = 1.0
sharpenStrength = 0.35
highlightCompression = 0.08
showColliders = false
showDecalBounds = false
showSelectionOutline = true
temperature = 0.0
tint = 0.0
vignette = false
vignetteColor = [ 0.0, 0.0, 0.0 ]
vignetteIntensity = 0.25
vignetteRoundness = 1.0
vignetteSmoothness = 0.45
wireframe = false

    [[render.customPostProcesses]]
    blend = 1.0
    enabled = false
    intensity = 1.0
    name = 'Default Custom'
    parameters = [ 0.0, 0.0, 0.0, 0.0 ]
    shader = 'assets/shaders/PostProcess/Custom/CustomPostProcess.hlsl'

[runtime]
start_scene = 'Assets/Scenes/Main.scene'

[screen]
height = 1080
width = 1920

[tags]
list = [ 'Untagged', 'Respawn', 'Finish', 'EditorOnly', 'MainCamera', 'Player', 'GameController' ]

[window]
fullscreen = false
height = 1080
title = 'FBZZ Game'
width = 1920
