[app]
targetFps = 144

[audio]
bgmVolume = 1.0
seVolume = 1.0

[layers]
names = [
    'Default',
    'TransparentFX',
    'Ignore Raycast',
    '',
    'Water',
    'UI',
    '',
    '',
    '',
    '',
    '',
    '',
    '',
