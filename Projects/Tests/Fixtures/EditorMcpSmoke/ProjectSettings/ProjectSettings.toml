# @file    ProjectSettings.toml
# @brief   WARP で起動する Editor MCP 検証用の設定。
# @author  Hasegawa Jin
# @date    2026-11-17
[app]
renderer = "dx12"
targetFps = 60

[runtime]
start_scene = "Assets/Scenes/Smoke.scene"

# @note 描画物のないシーンを WARP で回すため、シャドウ用 RT を最小構成にする。
[render]
shadow = false
shadowResolution = 256
clusteredEnabled = false
