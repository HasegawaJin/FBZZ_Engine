[physics]
gravity = [ 0.0, -9.81, 0.0 ]
hz = 60
substeps = 1

[project]
default_scene = 'Assets/Scenes/Main.scene'
name = 'FBZZ_TestStandaloneProject'

[render]
ambientOcclusion = true
ambientOcclusionIntensity = 1.0
bloom = true
bloomIntensity = 0.8
bloomSoftKnee = 0.35
bloomThreshold = 0.7
chromaticAberration = 0.005
chromaticAberrationEnabled = false
clarity = true
clarityRadius = 2.0
clarityStrength = 0.12
colorFilter = false
colorFilterColor = [ 1.0, 1.0, 1.0 ]
colorFilterIntensity = 0.0
colorGrading = true
contactShadowEnabled = false
contactShadowRayLength = 1.5
contactShadowSteps = 8
contactShadowStrength = 0.5
contactShadowThickness = 0.2
contrast = 0.0
customPostProcesses = []
depthOfField = false
dofBlurRadius = 3.0
dofFocusDistance = 8.0
dofFocusRange = 4.0
exposure = 1.0
filmGrain = false
filmGrainIntensity = 0.03
filmGrainResponse = 0.8
fog = false
fogColor = [ 0.01, 0.01, 0.04 ]
fogDensity = 0.06
fogFar = 10.0
fxaa = true
gtaoEnabled = false
gtaoIntensity = 1.0
gtaoRadius = 1.5
gtaoSlices = 3
gtaoStepsPerSlice = 4
highlightCompression = 0.08
hueShift = 0.0
iblDiffuseScale = 1.0
iblEnabled = false
iblIntensity = 1.0
iblIrradiancePath = ''
iblMaxMipLevel = 6
iblPrefilterPath = ''
iblSpecularScale = 1.0
invert = false
invertIntensity = 1.0
lensDistortion = 0.0
lensDistortionEnabled = false
lensFlareDistortion = 1.0
lensFlareEnabled = false
lensFlareGhostCount = 4
lensFlareHaloWidth = 0.4
lensFlareIntensity = 0.5
lutBlend = 1.0
lutContrast = 0.0
lutEnabled = false
lutHueShift = 0.0
lutSaturation = 1.0
lutTemperature = 0.0
lutTint = 0.0
motionBlurEnabled = false
motionBlurSamples = 8
motionBlurStrength = 0.5
outlineColor = [ 1.0, 0.82, 0.22, 1.0 ]
outlineWidth = 0.045
particleBudget = 20000
particleBudgetEnabled = true
passViewerEnabled = false
pcssEnabled = false
pcssLightRadius = 3.0
pipeline = 'forward'
pixelSize = 4.0
pixelate = false
posterize = false
posterizeLevels = 6.0
saturation = 1.0
sepia = false
sepiaIntensity = 0.75
shadow = true
shadowHighlight = true
shadowLift = 0.08
shadowPcfRadius = 2
shadowResolution = 8192
sharpen = false
sharpenRadius = 1.0
sharpenStrength = 0.35
showColliders = false
showDecalBounds = false
showSelectionOutline = true
ssrEnabled = false
ssrIntensity = 0.8
ssrMaxDistance = 50.0
ssrSteps = 32
ssrThickness = 0.15
taaEnabled = false
taaFeedback = 0.9
temperature = 0.0
tint = 0.0
viewMode = 0
vignette = false
vignetteColor = [ 0.0, 0.0, 0.0 ]
vignetteIntensity = 0.25
vignetteRoundness = 1.0
vignetteSmoothness = 0.45
volLightEnabled = false
volLightIntensity = 0.8
volLightMaxDist = 30.0
volLightScattering = 0.3
volLightSteps = 32

[runtime]
start_scene = 'Assets/Scenes/Main.scene'

[screen]
height = 1080
width = 1920

[tags]
list = [ 'Untagged', 'Respawn', 'Finish', 'EditorOnly', 'MainCamera', 'Player', 'GameController' ]

[ui]
default_font = 'Assets/Fonts/Default/Roboto/Roboto-VariableFont_wdth,wght'

[window]
fullscreen = false
height = 1080
title = 'FBZZ Game'
width = 1920