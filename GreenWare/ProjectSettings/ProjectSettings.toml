[app]
renderer = 'dx12'
targetFps = 0

[audio]
masterVolume = 1.0

    [[audio.bus]]
    name = 'Master'
    volume = 1.0

    [[audio.bus]]
    name = 'BGM'
    parent = 'Master'
    volume = 1.0

    [[audio.bus]]
    name = 'SE'
    parent = 'Master'
    volume = 1.0

    [[audio.bus]]
    name = 'UI'
    parent = 'Master'
    volume = 1.0

    [[audio.bus]]
    name = 'Voice'
    parent = 'Master'
    volume = 1.0

[layers]
names = [
    'Default',
    'TransparentFX',
    'Ignore Raycast',
    '',
    'Water',
    'UI',
