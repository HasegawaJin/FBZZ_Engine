[physics]
gravity = [ 0.0, -9.81, 0.0 ]
hz = 60
substeps = 1

[project]
default_scene = 'Assets/Scenes/Main.scene'
name = 'DemoGame'

[render]
ambientOcclusion = false
ambientOcclusionIntensity = 1.0
bloom = true
bloomIntensity = 0.8
bloomSoftKnee = 0.4
bloomThreshold = 0.65
chromaticAberration = 0.003
chromaticAberrationEnabled = false
clarity = true
clarityRadius = 2.0
clarityStrength = 0.15
colorFilter = false
colorFilterColor = [ 1.0, 1.0, 1.0 ]
colorFilterIntensity = 0.0
colorGrading = true
contactShadowEnabled = true
contactShadowRayLength = 1.5
contactShadowSteps = 32
contactShadowStrength = 0.7
contactShadowThickness = 0.2
contrast = 0.0
depthOfField = false
dofBlurRadius = 3.0
dofFocusDistance = 8.0
dofFocusRange = 4.0
exposure = 1.0
filmGrain = false
filmGrainIntensity = 0.03
filmGrainResponse = 0.8
fog = false
fogColor = [ 0.55, 0.65, 0.75 ]
fogDensity = 0.06
fogFar = 10.0
fxaa = true
gtaoEnabled = true
gtaoIntensity = 1.0
gtaoRadius = 1.5
gtaoSlices = 8
gtaoStepsPerSlice = 8
highlightCompression = 0.1
hueShift = 0.0
iblDiffuseScale = 1.0
iblEnabled = true
iblIntensity = 1.0
iblIrradiancePath = 'Assets/Textures/IBL/sky_irr.dds'
iblMaxMipLevel = 6
iblPrefilterPath = 'Assets/Textures/IBL/sky_prefilter.dds'
iblSpecularScale = 1.0
invert = false
invertIntensity = 1.0
lensDistortion = 0.0
lensDistortionEnabled = false
lensFlareDistortion = 1.0
lensFlareEnabled = true
lensFlareGhostCount = 4
lensFlareHaloWidth = 0.4
lensFlareIntensity = 0.5
lutBlend = 1.0
lutContrast = 0.0
lutEnabled = true
lutHueShift = 0.0
lutSaturation = 1.0
lutTemperature = 0.0
lutTint = 0.0
motionBlurEnabled = true
motionBlurSamples = 5
motionBlurStrength = 0.24
outlineColor = [ 1.0, 0.82, 0.22, 1.0 ]
outlineWidth = 0.045
passViewerEnabled = false
pcssEnabled = true
pcssLightRadius = 3.0
pipeline = 'deferred'
pixelSize = 4.0
pixelate = false
posterize = false
posterizeLevels = 6.0
saturation = 1.0
sepia = false
sepiaIntensity = 0.75
shadow = true
shadowHighlight = true
shadowLift = 0.06
shadowPcfRadius = 1
shadowResolution = 8192
sharpen = true
sharpenRadius = 1.0
sharpenStrength = 0.35
showColliders = false
showDecalBounds = false
showSelectionOutline = true
ssrEnabled = true
ssrIntensity = 0.8
ssrMaxDistance = 50.0
ssrSteps = 128
ssrThickness = 0.15
taaEnabled = false
taaFeedback = 0.049
temperature = 0.02
tint = 0.0
viewMode = 0
vignette = false
vignetteColor = [ 0.0, 0.0, 0.0 ]
vignetteIntensity = 0.18
vignetteRoundness = 1.0
vignetteSmoothness = 0.45
volLightEnabled = false
volLightIntensity = 0.8
volLightMaxDist = 30.0
volLightScattering = 0.3
volLightSteps = 128

    [[render.customPostProcesses]]
    blend = 1.0
    enabled = false
    intensity = 1.0
    name = 'Default Custom'
    parameters = [ 0.0, 0.0, 0.0, 0.0 ]
    shader = 'Assets/Shaders/PostProcess/Custom/CustomPostProcess.hlsl'

[runtime]
start_scene = 'Assets/Scenes/Main.scene'

[screen]
height = 1080
width = 1920

[tags]
list = [ 'Untagged', 'Respawn', 'Finish', 'EditorOnly', 'MainCamera', 'Player', 'GameController', 'Enemy' ]

[ui]
default_font = 'Assets/Fonts/Default/Roboto/Roboto-VariableFont_wdth,wght'

[window]
fullscreen = false
height = 1080
title = 'FBZZ Game'
width = 1920