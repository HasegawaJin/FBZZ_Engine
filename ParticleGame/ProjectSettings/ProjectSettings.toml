[physics]
gravity = [ 0.0, -9.81, 0.0 ]
hz = 60
substeps = 1

[project]
default_scene = 'Assets/Scenes/Main.scene'
name = 'ParticleGame'

[render]
ambientOcclusion = false
ambientOcclusionIntensity = 1.0
bloom = false
bloomIntensity = 0.9
bloomSoftKnee = 0.4
bloomThreshold = 0.65
chromaticAberration = 0.003
chromaticAberrationEnabled = false
clarity = false
clarityRadius = 2.0
clarityStrength = 0.15
colorFilter = false
colorFilterColor = [ 1.0, 1.0, 1.0 ]
colorFilterIntensity = 0.0
colorGrading = false
contactShadowEnabled = false
contactShadowRayLength = 1.5
contactShadowSteps = 32
contactShadowStrength = 0.7
contactShadowThickness = 0.2
contrast = 0.05
depthOfField = false
dofBlurRadius = 3.0
dofFocusDistance = 8.0
dofFocusRange = 4.0
exposure = 1.0
filmGrain = false
filmGrainIntensity = 0.03
filmGrainResponse = 0.8
fog = false
fogColor = [ 0.55, 0.65, 0.75 ]
fogDensity = 0.04
fogFar = 80.0
fxaa = false
gtaoEnabled = false
gtaoIntensity = 1.0
gtaoRadius = 1.5
gtaoSlices = 8
gtaoStepsPerSlice = 8
highlightCompression = 0.1
hueShift = 0.0
iblDiffuseScale = 1.0
iblEnabled = false
iblIntensity = 1.0
iblIrradiancePath = ''
iblMaxMipLevel = 6
iblPrefilterPath = ''
iblSpecularScale = 1.0
invert = false
invertIntensity = 1.0
lensDistortion = 0.0
lensDistortionEnabled = false
lensFlareDistortion = 1.0
lensFlareEnabled = false
lensFlareGhostCount = 4
lensFlareHaloWidth = 0.4
lensFlareIntensity = 0.5
lutBlend = 1.0
lutContrast = 0.0
lutEnabled = false
lutHueShift = 0.0
lutSaturation = 1.0
lutTemperature = 0.0
lutTint = 0.0
motionBlurEnabled = false
motionBlurSamples = 16
motionBlurStrength = 0.5
outlineColor = [ 1.0, 0.82, 0.22, 1.0 ]
outlineWidth = 0.045
particleBudget = 20000
particleBudgetEnabled = true
passViewerEnabled = false
pcssEnabled = false
pcssLightRadius = 3.0
pipeline = 'deferred'
pixelSize = 4.0
pixelate = false
posterize = false
posterizeLevels = 6.0
saturation = 1.1
sepia = false
sepiaIntensity = 0.75
shadow = true
shadowHighlight = false
shadowLift = 0.06
shadowPcfRadius = 3
shadowResolution = 8192
sharpen = false
sharpenRadius = 1.0
sharpenStrength = 0.25
showColliders = false
showDecalBounds = false
showSelectionOutline = false
ssrEnabled = false
ssrIntensity = 0.8
ssrMaxDistance = 50.0
ssrSteps = 128
ssrThickness = 0.15
taaEnabled = false
taaFeedback = 0.9
temperature = 0.02
tint = 0.0
viewMode = 0
vignette = false
vignetteColor = [ 0.0, 0.0, 0.0 ]
vignetteIntensity = 0.18
vignetteRoundness = 1.0
vignetteSmoothness = 0.45
volLightEnabled = false
volLightIntensity = 0.8
volLightMaxDist = 30.0
volLightScattering = 0.3
volLightSteps = 128

    [[render.customPostProcesses]]
    blend = 1.0
    enabled = false
    intensity = 1.0
    name = 'Default Custom'
    parameters = [ 0.0, 0.0, 0.0, 0.0 ]
    shader = 'assets/shaders/PostProcess/Custom/CustomPostProcess.hlsl'

[runtime]
start_scene = 'Assets/Scenes/Main.scene'

[screen]
height = 1080
width = 1920

[tags]
list = [ 'Untagged', 'Respawn', 'Finish', 'EditorOnly', 'MainCamera', 'Player', 'GameController' ]

[ui]
default_font = 'Assets/Fonts/Default/Roboto/Roboto-VariableFont_wdth,wght'

[window]
fullscreen = false
height = 1080
title = 'FBZZ Game'
width = 1920